[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abo-lsr"
dynamic = ["version"]
description = "Bayesian optimization with latent Gaussian HMM state recognition (ABO-LSR)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Viswanath Parashuram Yadavalli" }]
keywords = ["bayesian-optimization", "gaussian-process", "hidden-markov-model", "hyperparameter-tuning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# The optimizer itself needs only numpy and scipy.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
# California Housing experiment runner, CLI and plotting.
experiments = ["scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0"]
dev = ["abo-lsr[experiments]", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "build>=1.0"]

[project.scripts]
abo-lsr = "abo_lsr.cli:main"

[tool.setuptools.dynamic]
version = {attr = "abo_lsr.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abo_lsr = ["py.typed", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
